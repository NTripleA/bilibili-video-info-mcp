[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-video-info-mcp"
version = "0.2.0"
description = "An MCP server to fetch Bilibili video information like subtitles, comments, and danmaku."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # server.py uses mcp.server.fastmcp.FastMCP, which mcp 2.x renamed to MCPServer.
    # Keep the ceiling until the server is migrated, or fresh installs break on import.
    "mcp[cli]>=1.11.0,<2",
    "requests",
]
authors = [
    {name = "lesir"}
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
bilibili-video-info-mcp = "bilibili_video_info_mcp.__main__:main"

[tool.setuptools]
packages = ["bilibili_video_info_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
